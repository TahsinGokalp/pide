<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pide Mesaj · Pide Message</title>
  <meta name="description" content="Pidenin üstüne çörek otuyla yazı yaz, resmini indir, paylaş. Write on Turkish pide with nigella seeds.">
  <meta property="og:title" content="Pide Mesaj · Pide Message">
  <meta property="og:description" content="Pidenin üstüne çörek otuyla yazı yaz. Write on Turkish pide with nigella seeds.">
  <meta property="og:image" content="https://tahsingokalp.github.io/pide/docs/welcome.jpg">
  <meta name="theme-color" content="#2b1e16">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Dancing+Script:wght@700&family=Lobster&family=Pacifico&family=Titan+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
  <link rel="preload" as="image" href="img/oval.webp">
</head>
<body>
  <main class="layout">
    <h1 class="sr-only" data-i18n="title">Pide Mesaj</h1>
    <section class="stage" data-i18n-aria="stage" aria-label="Pide">
      <div class="lang" role="group" aria-label="Dil / Language">
        <button type="button" data-lang="tr" aria-pressed="true">TR</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <canvas id="pide" role="img" data-i18n-aria="canvas" aria-label="Üzerinde çörek otuyla yazı yazılmış pide"></canvas>
    </section>

    <form class="panel" id="panel" autocomplete="off" onsubmit="return false">
      <label class="field">
        <span class="label" data-i18n="text">Yazı</span>
        <textarea id="text" rows="2" maxlength="60" spellcheck="false">Hoşgeldiniz</textarea>
      </label>

      <fieldset class="field">
        <legend class="label" data-i18n="font">Yazı tipi</legend>
        <div class="chips" id="fonts"></div>
      </fieldset>

      <fieldset class="field">
        <legend class="label" data-i18n="bread">Pide</legend>
        <div class="segmented" id="shapes">
          <label><input type="radio" name="shape" value="oval" checked><span data-i18n="oval">Oval</span></label>
          <label><input type="radio" name="shape" value="yuvarlak"><span data-i18n="round">Yuvarlak</span></label>
          <label><input type="radio" name="shape" value="uzun"><span data-i18n="ridged">Tırnak pide</span></label>
          <label><input type="radio" name="shape" value="uzun-duz"><span data-i18n="long">Uzun düz</span></label>
        </div>
      </fieldset>

      <div class="field sliders">
        <label class="slider">
          <span class="label" data-i18n="density">Tane sıklığı</span>
          <input type="range" id="density" min="0" max="100" value="55">
        </label>
        <label class="slider">
          <span class="label" data-i18n="seedSize">Tane boyutu</span>
          <input type="range" id="seedSize" min="0" max="100" value="45">
        </label>
        <label class="slider">
          <span class="label" data-i18n="textSize">Yazı boyutu</span>
          <input type="range" id="textSize" min="50" max="100" value="100">
        </label>
      </div>

      <div class="field toggles">
        <label class="toggle"><input type="checkbox" id="outline"><span data-i18n="outline">Sadece kenar çizgisi</span></label>
        <label class="toggle"><input type="checkbox" id="border"><span data-i18n="border">Kenara çörek otu çerçeve</span></label>
        <label class="toggle"><input type="checkbox" id="sesame" checked><span data-i18n="sesame">Susam serp</span></label>
        <label class="toggle"><input type="checkbox" id="animate" checked><span data-i18n="animate">Serpme animasyonu</span></label>
      </div>

      <div class="actions">
        <button type="button" id="download" class="btn primary" data-i18n="download">PNG indir</button>
        <button type="button" id="reroll" class="btn ghost" data-i18n="reroll">Yeniden serp</button>
        <button type="button" id="share" class="btn ghost" data-i18n="share">Paylaş</button>
      </div>
      <p class="toast" id="toast" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="app.js?v=16"></script>
</body>
</html>
